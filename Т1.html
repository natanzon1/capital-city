<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Капитал-Сити</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b1423;
            padding: 8px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            background: #132a40;
            border-radius: 24px;
            border: 1px solid #ffd700;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Верхняя панель */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e3750;
            border-radius: 16px;
            padding: 8px 12px;
            border: 1px solid #4a7a9c;
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
        }

        .resources {
            display: flex;
            gap: 6px;
        }

        .resource {
            background: #2a4a6a;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            border: 1px solid #5f9dc9;
        }

        /* Сетка для блоков */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        /* Карточки */
        .card {
            background: #1e3750;
            border-radius: 16px;
            padding: 10px;
            border: 1px solid #4a7a9c;
        }

        .card-title {
            color: #ffd700;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            border-bottom: 1px solid #ffd700;
            padding-bottom: 2px;
        }

        /* Город - ОЧЕНЬ МАЛЕНЬКИЙ */
        .city-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .city-cell {
            aspect-ratio: 1;
            background: #2a4f73;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 1px solid #5f9dc9;
        }

        /* Финансы */
        .finance-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .label { color: #a0d0ff; }
        .income { color: #32cd32; font-weight: 600; }
        .expense { color: #ff6b6b; font-weight: 600; }

        /* Активы */
        .asset-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 4px 0;
            border-bottom: 1px solid #2a4a6a;
        }

        .asset-name { color: #a0d0ff; }
        .asset-value { color: #ffd700; font-weight: 600; }

        /* Биржа */
        .stock-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            padding: 4px 0;
            border-bottom: 1px solid #2a4a6a;
        }

        .stock-actions {
            display: flex;
            gap: 4px;
        }

        .stock-btn {
            background: #2a4a6a;
            border: 1px solid #5f9dc9;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            color: white;
        }

        /* Армия */
        .unit-card {
            background: #2a4a6a;
            border-radius: 8px;
            padding: 6px;
            border: 1px solid #b49450;
        }

        .unit-name {
            color: #ffd700;
            font-weight: 700;
            font-size: 10px;
            margin-bottom: 2px;
        }

        .unit-stats {
            font-size: 8px;
            color: #a0d0ff;
            margin-bottom: 2px;
        }

        .unit-count {
            font-size: 12px;
            font-weight: 700;
            color: white;
            text-align: center;
        }

        .capacity {
            font-size: 7px;
            color: #ffaa00;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- Верхняя панель -->
    <div class="header">
        <div class="title">💰 КАПИТАЛ-СИТИ</div>
        <div class="resources">
            <span class="resource">💰5.8M</span>
            <span class="resource">⛓️4.2k</span>
            <span class="resource">⚡3.4k</span>
        </div>
    </div>

    <!-- Финансы (маленькие цифры) -->
    <div class="card">
        <div class="card-title">💰 Финансы</div>
        <div style="display: flex; justify-content: space-between;">
            <div><span class="label">Доход:</span> <span class="income">312k</span></div>
            <div><span class="label">Расход:</span> <span class="expense">98k</span></div>
            <div><span class="label">Прибыль:</span> <span class="income">214k</span></div>
        </div>
    </div>

    <!-- Город (ОЧЕНЬ МАЛЕНЬКИЙ) -->
    <div class="card">
        <div class="card-title">🏙️ Город</div>
        <div class="city-grid" id="cityGrid"></div>
    </div>

    <!-- Активы и Ценности в одной строке -->
    <div class="grid-2">
        <div class="card">
            <div class="card-title">💼 Активы</div>
            <div class="asset-row"><span class="asset-name">Газпром</span><span class="asset-value">150</span></div>
            <div class="asset-row"><span class="asset-name">Сбербанк</span><span class="asset-value">300</span></div>
            <div class="asset-row"><span class="asset-name">Облигации</span><span class="asset-value">500k</span></div>
        </div>
        <div class="card">
            <div class="card-title">👑 Ценности</div>
            <div class="asset-row"><span class="asset-name">Золото</span><span class="asset-value">15кг</span></div>
            <div class="asset-row"><span class="asset-name">Антиквариат</span><span class="asset-value">8</span></div>
            <div class="asset-row"><span class="asset-name">Картины</span><span class="asset-value">2.5M</span></div>
        </div>
    </div>

    <!-- Биржа и Счета -->
    <div class="grid-2">
        <div class="card">
            <div class="card-title">📈 Биржа</div>
            <div class="stock-row">
                <span>Газпром</span><span>245</span>
                <div class="stock-actions"><button class="stock-btn">К</button><button class="stock-btn">П</button></div>
            </div>
            <div class="stock-row">
                <span>Норникель</span><span>3.4k</span>
                <div class="stock-actions"><button class="stock-btn">К</button><button class="stock-btn">П</button></div>
            </div>
            <div class="stock-row">
                <span>Сбербанк</span><span>183</span>
                <div class="stock-actions"><button class="stock-btn">К</button><button class="stock-btn">П</button></div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">🏦 Счета</div>
            <div class="asset-row"><span class="asset-name">Основной</span><span class="asset-value">1.25M</span></div>
            <div class="asset-row"><span class="asset-name">Депозит</span><span class="asset-value">500k</span></div>
            <div class="asset-row"><span class="asset-name">Кредит</span><span class="asset-value">до 2M</span></div>
        </div>
    </div>

    <!-- Армия (4 юнита в ряд) -->
    <div class="card">
        <div class="card-title">⚔️ Армия</div>
        <div class="grid-4" id="armyGrid"></div>
    </div>
</div>

<script>
    // Город (очень компактный)
    const cityIcons = ['🏛️', '🏦', '🏪', '🏛️', '✈️', '🛩️'];
    const cityGrid = document.getElementById('cityGrid');
    
    for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'city-cell';
        cell.textContent = i < cityIcons.length ? cityIcons[i] : '+';
        cityGrid.appendChild(cell);
    }

    // Армия (4 юнита)
    const units = [
        { name: 'Пехота', icon: '🔫', count: 0, max: 100, attack: 45 },
        { name: 'Техника', icon: '🚀', count: 0, max: 80, attack: 85 },
        { name: 'Авиация', icon: '✈️', count: 0, max: 60, attack: 120 },
        { name: 'ПВО', icon: '🎯', count: 0, max: 50, attack: 70 }
    ];

    const armyGrid = document.getElementById('armyGrid');
    
    units.forEach(unit => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `
            <div class="unit-name">${unit.icon} ${unit.name}</div>
            <div class="unit-stats">⚔️${unit.attack}</div>
            <div class="unit-count">${unit.count}</div>
            <div class="capacity">${unit.count}/${unit.max}</div>
        `;
        armyGrid.appendChild(card);
    });
</script>
</body>
</html>
